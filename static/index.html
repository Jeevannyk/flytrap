<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLYTRAP</title>
<style>
  :root { --bg:#0e1420; --panel:#161e2e; --line:#26324a; --text:#e6ebf5; --mute:#8b97b0;
          --gold:#d4a73a; --ok:#3fb27f; --warn:#e8913a; --bad:#e5534b; --info:#5b9cf5; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:14px; }
  h1 { margin:0; font-size:20px; letter-spacing:.18em; color:var(--gold); }
  header span { color:var(--mute); }
  main { display:grid; grid-template-columns:300px 1fr; gap:16px; padding:16px 20px; }
  @media (max-width:800px) { main { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; }
  label { display:block; color:var(--mute); margin:10px 0 4px; font-size:12px; }
  select, button { width:100%; padding:8px; border-radius:6px; border:1px solid var(--line); background:#0e1420; color:var(--text); font:inherit; }
  button { cursor:pointer; margin-top:8px; }
  button.primary { background:var(--gold); color:#14110a; border-color:var(--gold); font-weight:600; }
  button:disabled { opacity:.4; cursor:default; }
  .check { display:flex; gap:8px; align-items:center; margin-top:10px; color:var(--text); }
  .check input { width:auto; }
  .hint { color:var(--mute); font-size:12px; margin-top:8px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .badge { padding:2px 10px; border-radius:999px; font-size:12px; border:1px solid var(--line); }
  .badge.ok { color:var(--ok); border-color:var(--ok); } .badge.bad { color:var(--bad); border-color:var(--bad); }
  .badge.warn { color:var(--warn); border-color:var(--warn); }
  .ev { display:grid; grid-template-columns:34px 130px 1fr; gap:8px; padding:7px 8px; border-left:3px solid var(--line); margin-bottom:4px; background:#121a29; border-radius:0 6px 6px 0; }
  .ev .t { font-weight:600; } .ev .p { color:var(--mute); word-break:break-all; font-family:ui-monospace, Consolas, monospace; font-size:12px; }
  .ev.tool_call { border-color:var(--ok); } .ev.tool_call .t { color:var(--ok); }
  .ev.decoy_touch { border-color:var(--bad); background:#2a1519; } .ev.decoy_touch .t { color:var(--bad); }
  .ev.containment, .ev.blocked { border-color:var(--bad); } .ev.containment .t, .ev.blocked .t { color:var(--bad); }
  .ev.policy_block { border-color:var(--warn); } .ev.policy_block .t { color:var(--warn); }
  .ev.replay_result, .ev.reset { border-color:var(--info); } .ev.replay_result .t, .ev.reset .t { color:var(--info); }
  .ev.session_start, .ev.session_end { border-color:var(--mute); }
  .evidence { white-space:pre-wrap; background:#0e1420; border:1px solid var(--line); border-radius:6px; padding:10px; font-family:ui-monospace, Consolas, monospace; font-size:12px; }
  mark { background:#5a2a2f; color:#ffd7d4; padding:1px 3px; border-radius:3px; }
  table { border-collapse:collapse; width:100%; font-size:12.5px; } th, td { border:1px solid var(--line); padding:6px 8px; text-align:left; } th { color:var(--mute); }
  h2 { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); margin:16px 0 8px; }
</style>
</head>
<body>
<header><h1>FLYTRAP</h1><span>Plant the trap. Catch the action. Stop the agent. Find the likely cause. Preserve the evidence.</span></header>
<main>
  <section class="panel">
    <label for="scenario">Scenario</label>
    <select id="scenario"></select>
    <div class="hint" id="expect"></div>
    <label class="check"><input type="checkbox" id="protected" checked> FLYTRAP protection on</label>
    <button class="primary" id="run">Run agent</button>
    <h2>After a run</h2>
    <button id="investigate" disabled>Investigate (replay)</button>
    <button id="tamper" disabled>Tamper with a record (demo)</button>
    <button id="reset" disabled>Authorized reset</button>
    <h2>Measured results</h2>
    <button id="evaluate">Run evaluation</button>
    <div class="hint">Agent is a deterministic simulation of a prompt-injectable agent. Baseline is a keyword filter, not an LLM judge.</div>
  </section>
  <section>
    <div class="panel">
      <div class="row"><strong id="title">No run yet</strong><span class="badge" id="status"></span><span class="badge" id="chain"></span></div>
      <div id="events"></div>
    </div>
    <div class="panel" id="replay" style="margin-top:16px; display:none"></div>
    <div class="panel" id="eval" style="margin-top:16px; display:none"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let current = null, scenarios = [];
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const api = (path, opts) => fetch('/api' + path, opts).then(r => r.json());

async function init() {
  scenarios = await api('/scenarios');
  $('scenario').innerHTML = scenarios.map(s => `<option value="${s.id}">${esc(s.title)}</option>`).join('');
  const show = () => $('expect').textContent = scenarios.find(s => s.id === $('scenario').value).expectation;
  $('scenario').onchange = show; show();
}

function summarize(e) {
  const p = e.payload;
  if (e.type === 'tool_call') return `${p.tool}(${JSON.stringify(p.args)})` + (p.untrusted ? '  [untrusted input]' : '');
  if (e.type === 'decoy_touch') return `touched ${p.decoy} via ${p.tool}(${JSON.stringify(p.args)})`;
  if (e.type === 'containment') return p.actions.join(', ');
  if (e.type === 'blocked') return `${p.tool} blocked: ${p.reason}`;
  if (e.type === 'policy_block') return `${p.rule}: ${p.args.to}`;
  if (e.type === 'replay_result') return p.candidates.map(c => c.sentence).join(' | ');
  if (e.type === 'session_end') return `harm completed: ${p.harm_completed}`;
  if (e.type === 'session_start') return `${p.scenario} (protected: ${p.protected})`;
  return JSON.stringify(p);
}

function render(d, replay) {
  current = d;
  const s = d.session, sc = scenarios.find(x => x.id === s.scenario);
  $('title').textContent = sc ? sc.title : s.scenario;
  $('status').textContent = s.status; $('status').className = 'badge ' + (s.status === 'frozen' ? 'bad' : 'ok');
  $('chain').textContent = d.chain.ok ? `chain verified (${d.chain.length} events)` : `CHAIN BROKEN at event ${d.chain.bad_index}`;
  $('chain').className = 'badge ' + (d.chain.ok ? 'ok' : 'bad');
  $('events').innerHTML = d.events.map(e =>
    `<div class="ev ${e.type}"><span>${e.idx}</span><span class="t">${e.type}</span><span class="p">${esc(summarize(e))}</span></div>`).join('');
  for (const id of ['investigate', 'tamper', 'reset']) $(id).disabled = false;
  if (replay !== undefined) showReplay(replay);
}

function showReplay(r) {
  const box = $('replay'); box.style.display = 'block';
  if (r.status !== 'ok') { box.innerHTML = `<strong>Investigation:</strong> ${esc(r.status)}`; return; }
  let html = `<strong>Likely triggering input</strong> <span class="badge warn">${esc(r.method)}</span>`;
  const sources = {};
  current.events.filter(e => e.payload.untrusted).forEach(e => sources[e.payload.args.url] = e.payload.text);
  for (const [url, text] of Object.entries(sources)) {
    let t = esc(text);
    r.candidates.filter(c => c.source === url).forEach(c => { t = t.replace(esc(c.sentence), m => `<mark>${m}</mark>`); });
    html += `<div class="hint">${esc(url)}</div><div class="evidence">${t}</div>`;
  }
  box.innerHTML = html + `<div class="hint">${esc(r.note)}</div>`;
}

$('run').onclick = async () => {
  $('replay').style.display = 'none';
  const d = await api('/run', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ scenario: $('scenario').value, protected: $('protected').checked }) });
  render(d);
};
$('investigate').onclick = async () => {
  const r = await api(`/sessions/${current.session.id}/investigate`, { method:'POST' });
  render(await api(`/sessions/${current.session.id}`), r);
};
$('tamper').onclick = async () => render(await api(`/sessions/${current.session.id}/tamper`, { method:'POST' }));
$('reset').onclick = async () => {
  const r = await fetch(`/api/sessions/${current.session.id}/reset`, { method:'POST', headers:{'X-Admin-Key':'demo-admin'} });
  render(await r.json());
};
$('evaluate').onclick = async () => {
  const r = await api('/evaluate'), yn = b => b ? 'yes' : 'no', box = $('eval');
  box.style.display = 'block';
  box.innerHTML = '<strong>Measured results</strong><table><tr><th>Scenario</th><th>Harm unprotected</th><th>FLYTRAP detected (by)</th><th>Harm with FLYTRAP</th><th>Keyword filter flags page</th></tr>' +
    r.rows.map(x => `<tr><td>${esc(x.title)}</td><td>${yn(x.harm_unprotected)}</td><td>${yn(x.flytrap_detected)} (${x.detected_by})</td><td>${yn(x.harm_protected)}</td><td>${yn(x.keyword_filter_flags_page)}</td></tr>`).join('') +
    `</table><div class="hint">False alarms on clean runs: ${r.false_alarms} / ${r.clean_runs}</div>`;
};
init();
</script>
</body>
</html>
